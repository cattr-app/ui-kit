name: CI

on:
  pull_request:
  push:
    branches: [main, feat/vue-3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by the coverage report action to comment on the PR.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Corepack must be enabled before setup-node so that `cache: pnpm` finds pnpm.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --max-warnings 0

      - name: Check formatting
        run: pnpm format:check

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: >-
          node -e 'const t = require("./coverage/coverage-summary.json").total;
          const rows = ["statements", "branches", "functions", "lines"].map((k) => "| " + k + " | " + t[k].pct + "% | " + t[k].covered + "/" + t[k].total + " |");
          console.log(["### Coverage", "", "| Metric | % | Covered/Total |", "| --- | --- | --- |", ...rows].join("\n"))'
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Build library
        run: pnpm build

      - name: Build documentation
        run: pnpm build:docs
