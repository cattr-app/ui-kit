name: CI

on:
  pull_request:
  push:
    branches: [main, feat/vue-3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by the coverage report action to comment on the PR.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Corepack must be enabled before setup-node so that `cache: pnpm` finds pnpm.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --max-warnings 0

      - name: Check formatting
        run: pnpm format:check

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: >-
          node -e 'const t = require("./coverage/coverage-summary.json").total;
          const rows = ["statements", "branches", "functions", "lines"].map((k) => "| " + k + " | " + t[k].pct + "% | " + t[k].covered + "/" + t[k].total + " |");
          console.log(["### Coverage", "", "| Metric | % | Covered/Total |", "| --- | --- | --- |", ...rows].join("\n"))'
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          # totals only: the per-file table exceeded the PR comment size limit
          file-coverage-mode: none

      - name: Build library
        run: pnpm build

      - name: Build documentation
        run: pnpm build:docs

  e2e:
    # Browser tests against the docs site. They run inside the Playwright image, the same one
    # the visual baseline is taken in locally, so the screenshots match pixel for pixel.
    # The image tag must follow the @playwright/test version in package.json.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The image ships Node.js 24 with Corepack; pnpm comes from `packageManager`.
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Browser tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
