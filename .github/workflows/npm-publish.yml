name: Publish Package

on:
  release:
    # `published` fires both for releases created directly and for drafts that are
    # published later; `created` is never delivered for draft releases.
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v2.0.0)
        required: true
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      # package.json may already carry the release version (2.0.0+); `npm version from-git`
      # fails with "Version not changed" in that case, so only bump when they differ.
      - name: Set version from tag
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          current="$(node -p "require('./package.json').version")"
          if [ "$current" != "$version" ]; then
            npm --no-git-tag-version version "$version"
          fi
          echo "publishing @amazingcat/cattr-ui@$version"

      - name: Build
        run: pnpm build:package

      - run: npm publish
