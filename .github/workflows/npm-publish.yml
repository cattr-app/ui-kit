name: Publish Package

on:
  release:
    # `published` fires both for releases created directly and for drafts that are
    # published later; `created` is never delivered for draft releases.
    types: [published]

permissions:
  id-token: write
  contents: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      # package.json keeps a placeholder version (0.0.0); the published version comes from
      # the release tag. Skipped if they already match (`npm version` refuses a no-op).
      - name: Set version from tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          current="$(node -p "require('./package.json').version")"
          if [ "$current" != "$version" ]; then
            npm --no-git-tag-version version "$version"
          fi
          echo "publishing @amazingcat/cattr-ui@$version"

      - name: Build
        run: pnpm build:package

      - run: npm publish
